name: Java CI + Docker Security Template

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      build-tool:
        required: true
        type: string
      service-name:
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
      docker-image:
        required: true
        type: string
      project-path:
        required: false
        type: string
        default: "."
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  ci:
    name: Code Quality • Security • Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout Caller Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- VALIDATION ----------------
      - name: Validate Build Tool
        run: |
          if [[ "${{ inputs.build-tool }}" != "maven" && "${{ inputs.build-tool }}" != "gradle" ]]; then
            echo "Invalid build tool. Use 'maven' or 'gradle'"
            exit 1
          fi

      # ---------------- JAVA SETUP ----------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: ${{ inputs.build-tool }}

      # ---------------- CACHE ----------------
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
          key: ${{ runner.os }}-${{ inputs.build-tool }}-${{ hashFiles('**/pom.xml', '**/*.gradle*') }}

      # ---------------- BUILD ----------------
      - name: Build Project
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "${{ inputs.build-tool }}" = "gradle" ]; then
            chmod +x gradlew
            ./gradlew clean build -x test
          else
            mvn clean verify -DskipTests
          fi

      # ---------------- UNIT TESTS ----------------
      - name: Run Unit Tests
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn test
          else
            ./gradlew test
          fi

      # ---------------- COVERAGE ----------------
      - name: Generate Code Coverage
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn jacoco:report
          else
            ./gradlew jacocoTestReport
          fi

      # ---------------- SONARQUBE SCAN (PR AWARE) ----------------
      - name: SonarQube Scan
        working-directory: ${{ inputs.project-path }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA_ARGS="
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
              -Dsonar.pullrequest.branch=${{ github.head_ref }}
              -Dsonar.pullrequest.base=${{ github.base_ref }}
            "
          fi

          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn sonar:sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN \
              $EXTRA_ARGS
          else
            ./gradlew sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN \
              $EXTRA_ARGS
          fi

      # ---------------- SONAR QUALITY GATE ----------------
      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # ---------------- GITHUB JOB SUMMARY ----------------
      - name: SonarQube Summary (GitHub Only)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          PROJECT_KEY="${{ inputs.sonar-project-key }}"

          sleep 10

          METRICS=$(curl -s -u "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/measures/component?component=$PROJECT_KEY&metricKeys=bugs,code_smells,vulnerabilities,coverage")

          BUGS=$(echo "$METRICS" | jq -r '.component.measures[] | select(.metric=="bugs") | .value')
          SMELLS=$(echo "$METRICS" | jq -r '.component.measures[] | select(.metric=="code_smells") | .value')
          VULNS=$(echo "$METRICS" | jq -r '.component.measures[] | select(.metric=="vulnerabilities") | .value')
          COVERAGE=$(echo "$METRICS" | jq -r '.component.measures[] | select(.metric=="coverage") | .value')

          echo "## 📊 SonarQube Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🐞 Bugs: **${BUGS:-0}**" >> $GITHUB_STEP_SUMMARY
          echo "- 🧹 Code Smells: **${SMELLS:-0}**" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 Vulnerabilities: **${VULNS:-0}**" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 Coverage: **${COVERAGE:-0}%**" >> $GITHUB_STEP_SUMMARY

      # ---------------- TRIVY FILE SYSTEM SCAN ----------------
      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.project-path }}
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------------- DOCKER LOGIN ----------------
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # ---------------- DOCKER BUILD ----------------
      - name: Build Docker Image
        run: |
          docker build -t ${{ inputs.docker-image }}:${{ github.sha }} ${{ inputs.project-path }}
          docker tag ${{ inputs.docker-image }}:${{ github.sha }} ${{ inputs.docker-image }}:latest

      # ---------------- TRIVY IMAGE SCAN ----------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ inputs.docker-image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------------- PUSH IMAGE ----------------
      - name: Push Docker Image
        run: |
          docker push ${{ inputs.docker-image }}:${{ github.sha }}
          docker push ${{ inputs.docker-image }}:latest
