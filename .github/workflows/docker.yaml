name: Docker Build & Security Scan

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      project-path:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- DOCKER LOGIN ----------------
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # ---------------- BUILD IMAGE ----------------
      - name: Build Docker Image
        working-directory: ${{ inputs.project-path }}
        run: |
          docker build -t ${{ inputs.docker-image }}:${{ github.sha }} .
          docker tag ${{ inputs.docker-image }}:${{ github.sha }} \
                     ${{ inputs.docker-image }}:latest

      # ---------------- CREATE REPORT FOLDER ----------------
      - name: Create Reports Directory
        run: mkdir -p reports

      # ---------------- TRIVY SCAN (NO FAIL, NO FILTER) ----------------
      - name: Trivy Scan (Monitor Only)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/reports:/reports \
            aquasec/trivy:latest \
            image \
            --format template \
            --template "@/contrib/html.tpl" \
            --output /reports/trivy-report.html \
            ${{ inputs.docker-image }}:${{ github.sha }} || true

      # ---------------- UPLOAD REPORT ----------------
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: reports
          retention-days: 5

      # ---------------- PUSH IMAGE ----------------
      - name: Push Image
        run: |
          docker push ${{ inputs.docker-image }}:${{ github.sha }}
          docker push ${{ inputs.docker-image }}:latest
