name: Java CI + Docker Security Template

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      build-tool:
        required: true
        type: string
      service-name:
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
      docker-image:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  ci:
    name: Code Quality • Security • Docker
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- VALIDATION ----------------
      - name: Validate Build Tool
        run: |
          if [[ "${{ inputs.build-tool }}" != "maven" && "${{ inputs.build-tool }}" != "gradle" ]]; then
            echo "Invalid build tool. Use 'maven' or 'gradle'"
            exit 1
          fi

      # ---------------- JAVA SETUP ----------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # ---------------- CACHE ----------------
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
          key: |
            ${{ runner.os }}-${{ inputs.build-tool }}-${{ hashFiles('**/pom.xml', '**/*.gradle*') }}

      # ---------------- BUILD ----------------
      - name: Build Application
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn clean compile
          else
            chmod +x gradlew
            ./gradlew clean build -x test
          fi

      # ---------------- UNIT TESTS ----------------
      - name: Run Unit Tests
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn test
          else
            ./gradlew test
          fi

      # ---------------- COVERAGE ----------------
      - name: Generate Code Coverage
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn jacoco:report
          else
            ./gradlew jacocoTestReport
          fi

      # ---------------- SONARQUBE ----------------
      - name: SonarQube Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn sonar:sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN
          else
            ./gradlew sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN
          fi

      # ---------------- TRIVY FS SCAN ----------------
      - name: Trivy Code Scan (FS)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------------- DOCKER LOGIN ----------------
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ---------------- DOCKER BUILD ----------------
      - name: Build Docker Image
        run: |
          docker build -t ${{ inputs.docker-image }}:latest .

      # ---------------- TRIVY IMAGE SCAN ----------------
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.docker-image }}:latest
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------------- PUSH IMAGE ----------------
      - name: Push Docker Image
        run: |
          docker push ${{ inputs.docker-image }}:latest
