on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      build-tool:
        required: true
        type: string
      service-name:
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
      docker-image:
        required: true
        type: string
      project-path:
        required: false
        type: string
        default: "."

      # -------- CONTROL FLAGS --------
      run-build:
        type: boolean
        default: true
      run-test:
        type: boolean
        default: true
      run-coverage:
        type: boolean
        default: true
      run-sonar:
        type: boolean
        default: true
      run-fs-scan:
        type: boolean
        default: true
      run-docker:
        type: boolean
        default: true
      run-image-scan:
        type: boolean
        default: true
      run-push:
        type: boolean
        default: true

    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - uses: actions/checkout@v4

      # ---------------- JAVA ----------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # ---------------- BUILD ----------------
      - name: Build Project
        if: ${{ inputs.run-build }}
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "${{ inputs.build-tool }}" = "gradle" ]; then
            chmod +x gradlew
            ./gradlew clean build -x test
          else
            mvn clean verify -DskipTests
          fi

      # ---------------- TEST ----------------
      - name: Run Unit Tests
        if: ${{ inputs.run-test }}
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn test
          else
            ./gradlew test
          fi

      # ---------------- COVERAGE ----------------
      - name: Generate Coverage
        if: ${{ inputs.run-coverage }}
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn jacoco:report
          else
            ./gradlew jacocoTestReport
          fi

      # ---------------- SONAR ----------------
      - name: SonarQube Scan
        if: ${{ inputs.run-sonar }}
        working-directory: ${{ inputs.project-path }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn sonar:sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.token=$SONAR_TOKEN
          else
            ./gradlew sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.token=$SONAR_TOKEN
          fi

      # ---------------- TRIVY FILE SCAN ----------------
      - name: Trivy FS Scan
        if: ${{ inputs.run-fs-scan }}
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.project-path }}
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------------- DOCKER LOGIN ----------------
      - name: Docker Login
        if: ${{ inputs.run-docker }}
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # ---------------- DOCKER BUILD ----------------
      - name: Build Docker Image
        if: ${{ inputs.run-docker }}
        run: |
          docker build -t ${{ inputs.docker-image }}:${{ github.sha }} ${{ inputs.project-path }}
          docker tag ${{ inputs.docker-image }}:${{ github.sha }} ${{ inputs.docker-image }}:latest

      # ---------------- IMAGE SCAN ----------------
      - name: Trivy Image Scan
        if: ${{ inputs.run-image-scan }}
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ inputs.docker-image }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------------- PUSH ----------------
      - name: Push Docker Image
        if: ${{ inputs.run-push }}
        run: |
          docker push ${{ inputs.docker-image }}:${{ github.sha }}
          docker push ${{ inputs.docker-image }}:latest
