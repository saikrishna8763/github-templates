name: Docker Template

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      project-path:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build Image
        working-directory: ${{ inputs.project-path }}
        run: |
          docker build -t ${{ inputs.docker-image }}:${{ github.sha }} .
          docker tag ${{ inputs.docker-image }}:${{ github.sha }} \
                     ${{ inputs.docker-image }}:latest
