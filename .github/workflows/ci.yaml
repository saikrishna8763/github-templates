name: Reusable Gradle CI with Sonar & ACR

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      image-name:
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      ACR_LOGIN_SERVER:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Cache Gradle & Sonar
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.sonar/cache
          key: ${{ runner.os }}-gradle-sonar-${{ hashFiles('**/*.gradle*') }}

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build and Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew clean build sonar \
            -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image-name }}-jar
          path: build/libs/*.jar

      - name: Login to Azure ACR
        run: |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
          -u ${{ secrets.ACR_USERNAME }} \
          -p ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:latest .

      #  ----Trivy Scan (NEW)-----
      - name: Trivy Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:latest
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Push Docker image
        run: |
          docker push \
          ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:latest
