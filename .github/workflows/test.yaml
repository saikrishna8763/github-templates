name: Test Template

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      build-tool:
        required: true
        type: string
      project-path:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Run Tests
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn test
          else
            ./gradlew test
          fi
