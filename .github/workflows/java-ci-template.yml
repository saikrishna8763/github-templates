name: Java Gradle CI with Sonar, Trivy & ACR

on:
  workflow_call:
    inputs:
      sonar_project_key:
        required: true
        type: string
      image_name:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true
      ACR_LOGIN_SERVER:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT -----------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------- JAVA SETUP ----------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------------- CACHE ----------------
      - name: Cache Gradle & Sonar
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.sonar/cache
          key: ${{ runner.os }}-gradle-sonar-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # ---------------- PERMISSIONS ----------------
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # ---------------- BUILD + SONAR ----------------
      - name: Build and Analyze with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew clean build sonar \
            -Dsonar.projectKey=${{ inputs.sonar_project_key }} \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN

      # ---------------- JAR ARTIFACT ----------------
      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar

      # ---------------- ACR LOGIN ----------------
      - name: Login to Azure ACR
        run: |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
          -u ${{ secrets.ACR_USERNAME }} \
          -p ${{ secrets.ACR_PASSWORD }}

      # ---------------- DOCKER BUILD ----------------
      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image_name }}:${{ github.sha }} .

      # ---------------- TRIVY INSTALL ----------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.0_Linux-64bit.deb

      # ---------------- TRIVY IMAGE SCAN ----------------
      - name: Trivy Image Scan (High & Critical)
        run: |
          trivy image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image_name }}:${{ github.sha }}

      # ---------------- DOCKER PUSH ----------------
      - name: Push Docker image to ACR
        run: |
          docker push \
          ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image_name }}:${{ github.sha }}
