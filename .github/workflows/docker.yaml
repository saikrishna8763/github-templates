name: Docker Build & Security Scan

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      project-path:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build Docker Image
        working-directory: ${{ inputs.project-path }}
        run: |
          docker build -t ${{ inputs.docker-image }}:${{ github.sha }} .
          docker tag ${{ inputs.docker-image }}:${{ github.sha }} \
                     ${{ inputs.docker-image }}:latest

      - name: Trivy Image Scan (Library Only)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ inputs.docker-image }}:${{ github.sha }}
          vuln-type: library
          severity: HIGH,CRITICAL
          format: table
          exit-code: 1

      - name: Push Image
        run: |
          docker push ${{ inputs.docker-image }}:${{ github.sha }}
          docker push ${{ inputs.docker-image }}:latest
