name: Docker Build & Security Scan

on:
  workflow_call:
    inputs:
      docker-image:
        required: true
        type: string
      project-path:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- DOCKER LOGIN ----------------
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # ---------------- BUILD IMAGE ----------------
      - name: Build Docker Image
        working-directory: ${{ inputs.project-path }}
        run: |
          docker build -t ${{ inputs.docker-image }}:${{ github.sha }} .
          docker tag ${{ inputs.docker-image }}:${{ github.sha }} \
                     ${{ inputs.docker-image }}:latest

      # ---------------- CREATE REPORT FOLDER ----------------
      - name: Create Reports Directory
        run: mkdir -p reports

      # ---------------- TRIVY JSON REPORT ----------------
      - name: Trivy JSON Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/reports:/reports \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --format json \
            --output /reports/trivy-report.json \
            ${{ inputs.docker-image }}:${{ github.sha }}

      # ---------------- TRIVY HTML REPORT ----------------
      - name: Trivy HTML Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/reports:/reports \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --format template \
            --template "@/contrib/html.tpl" \
            --output /reports/trivy-report.html \
            ${{ inputs.docker-image }}:${{ github.sha }}

      # ---------------- UPLOAD REPORTS ----------------
      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: reports
          retention-days: 5

      # ---------------- FAIL AFTER UPLOAD ----------------
      - name: Fail If HIGH or CRITICAL Found
        run: |
          COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' reports/trivy-report.json)
          echo "Vulnerabilities Found: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "❌ High/Critical vulnerabilities detected!"
            exit 1
          else
            echo "✅ No High/Critical vulnerabilities found."
          fi

      # ---------------- PUSH IMAGE ONLY IF SAFE ----------------
      - name: Push Image
        if: success()
        run: |
          docker push ${{ inputs.docker-image }}:${{ github.sha }}
          docker push ${{ inputs.docker-image }}:latest
