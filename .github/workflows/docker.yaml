name: Docker Build & Security Scan

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      project-path:
        required: true
        type: string
    secrets:
      ACR_LOGIN_SERVER:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------- CREATE REPORT DIRECTORY ----------------
      - name: Create Reports Directory
        run: mkdir -p reports

      # ---------------- TRIVY FILE SYSTEM SCAN (HTML REPORT) ----------------
      - name: Trivy FS Scan (HTML Report)
        run: |
          docker run --rm \
            -v $(pwd):/app \
            -v $(pwd)/reports:/reports \
            aquasec/trivy:latest \
            fs \
            --severity HIGH,CRITICAL \
            --format template \
            --template "@/contrib/html.tpl" \
            --output /reports/trivy-fs-report.html \
            /app

      # ---------------- UPLOAD FS REPORT ----------------
      - name: Upload Trivy FS Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: reports/trivy-fs-report.html
          retention-days: 7

      # ---------------- LOGIN TO AZURE ACR ----------------
      - name: Login to Azure ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      # ---------------- BUILD IMAGE ----------------
      - name: Build Docker Image
        working-directory: ${{ inputs.project-path }}
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.sha }} .

          docker tag \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.sha }} \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:latest

      # ---------------- TRIVY SECURITY GATE ----------------
      - name: Trivy Security Gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.sha }}

      # ---------------- GENERATE IMAGE HTML REPORT ----------------
      - name: Generate Trivy Image HTML Report
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $(pwd)/reports:/reports \
            aquasec/trivy:latest \
            image \
            --format template \
            --template "@/contrib/html.tpl" \
            --output /reports/trivy-image-report.html \
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.sha }}

      # ---------------- UPLOAD IMAGE REPORT ----------------
      - name: Upload Trivy Image Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: reports/trivy-image-report.html
          retention-days: 7

      # ---------------- PUSH IMAGE ----------------
      - name: Push Image
        if: success()
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ inputs.image-name }}:latest
