name: Java CI Template

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        type: string
      build-tool:
        required: true
        type: string
      service-name:
        required: true
        type: string
      sonar-project-key:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

jobs:
  build:
    name: Build • Test • Scan • Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for SonarQube

      # ---------------- VALIDATION ----------------
      - name: Validate Build Tool
        run: |
          if [[ "${{ inputs.build-tool }}" != "maven" && "${{ inputs.build-tool }}" != "gradle" ]]; then
            echo "❌ Invalid build-tool value. Use 'maven' or 'gradle'."
            exit 1
          fi

      # ---------------- JAVA SETUP ----------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # ---------------- CACHE ----------------
      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
          key: |
            ${{ runner.os }}-${{ inputs.build-tool }}-${{ hashFiles('**/pom.xml', '**/*.gradle*') }}

      # ---------------- BUILD ----------------
      - name: Build Application
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn clean compile
          else
            chmod +x gradlew
            ./gradlew clean build -x test
          fi

      # ---------------- UNIT TESTS ----------------
      - name: Run Unit Tests
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn test
          else
            ./gradlew test
          fi

      # ---------------- INTEGRATION TESTS ----------------
      - name: Run Integration Tests
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn verify -Pintegration-tests
          else
            ./gradlew integrationTest
          fi

      # ---------------- CODE COVERAGE ----------------
      - name: Generate Code Coverage
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn jacoco:report
          else
            ./gradlew jacocoTestReport
          fi

      # ---------------- SECURITY SCAN ----------------
      - name: Trivy File System Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      # ---------------- SONARQUBE ----------------
      - name: SonarQube Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ "${{ inputs.build-tool }}" = "maven" ]; then
            mvn sonar:sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN
          else
            ./gradlew sonar \
              -Dsonar.projectKey=${{ inputs.sonar-project-key }} \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN
          fi

      # ---------------- ARTIFACT ----------------
      - name: Upload Build Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service-name }}-artifact
          path: |
            target/*.jar
            build/libs/*.jar
